<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Create Account - CleanHome Service</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enables dark mode via a class on the <html> tag
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Trustworthy Sky Blue
                        secondary: '#0284c7',
                        accent: '#38bdf8',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Smooth Background Transitions */
        body {
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* RTL adjustments */
        [dir="rtl"] .icon-left {
            left: auto !important;
            right: 0.875rem !important;
        }

        [dir="rtl"] .input-field {
            padding-left: 1rem !important;
            padding-right: 2.5rem !important;
        }
    </style>
</head>

<body
    class="font-sans text-gray-800 bg-gray-50 dark:bg-darkBg dark:text-gray-100 min-h-screen flex flex-col items-center justify-start sm:justify-center relative overflow-x-hidden p-4 sm:p-6 py-6 sm:py-8">

    <!-- Decorative Background Elements -->
    <div
        class="absolute top-[-5%] left-[-10%] w-72 h-72 sm:w-96 sm:h-96 bg-primary/20 rounded-full blur-3xl pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-5%] right-[-10%] w-72 h-72 sm:w-96 sm:h-96 bg-secondary/20 rounded-full blur-3xl pointer-events-none">
    </div>

    <!-- Auth Wrapper Container -->
    <div class="w-full max-w-md my-auto flex flex-col items-center relative z-10">

        <!-- Top Navigation & Controls Bar (Responsive: sits cleanly above card on mobile, fixed at screen corners on desktop) -->
        <header
            class="w-full flex items-center justify-between mb-4 sm:mb-0 sm:fixed sm:top-6 sm:inset-x-0 sm:px-8 z-30">
            <!-- Back to Home -->
            <a href="index.html"
                class="inline-flex items-center gap-2 text-xs sm:text-sm font-semibold text-gray-600 hover:text-primary dark:text-gray-300 dark:hover:text-primary transition-all bg-white dark:bg-darkCard px-3.5 py-2 rounded-full shadow-md border border-gray-100 dark:border-gray-800 hover:shadow-lg active:scale-95">
                <i class="fas fa-arrow-left rtl:rotate-180"></i>
                <span>Home</span>
            </a>

            <!-- Theme & RTL Toggles -->
            <div class="flex items-center gap-2 sm:gap-3">
                <button id="themeToggle"
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-darkCard shadow-md border border-gray-100 dark:border-gray-700 hover:text-primary transition-all text-gray-600 dark:text-gray-300 active:scale-95"
                    title="Toggle Theme" aria-label="Toggle Theme">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
                </button>
                <button id="rtlToggle"
                    class="px-4 h-10 flex items-center justify-center rounded-full bg-white dark:bg-darkCard shadow-md border border-gray-100 dark:border-gray-700 hover:text-primary transition-all font-bold text-xs text-gray-600 dark:text-gray-300 active:scale-95"
                    title="Toggle RTL" aria-label="Toggle RTL">
                    <span id="rtlText">LTR</span>
                </button>
            </div>
        </header>

        <!-- Main Signup Card -->
        <main
            class="w-full bg-white dark:bg-darkCard border border-gray-100 dark:border-gray-800 p-5 sm:p-8 shadow-2xl relative rounded-2xl sm:rounded-3xl">

            <!-- Header & Exact Logo Match -->
            <div class="text-center mb-5 sm:mb-6">
                <div class="flex justify-center mb-3 sm:mb-4">
                    <!-- LOGO: 100% Identical to Main Pages -->
                    <a href="index.html" class="flex items-center gap-1.5 sm:gap-2 text-decoration-none">
                        <i
                            class="fas fa-broom text-2xl sm:text-3xl text-primary bg-clip-text bg-gradient-to-br from-primary to-secondary"></i>
                        <span
                            class="font-serif text-xl sm:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary tracking-tight">CleanHome</span>
                    </a>
                </div>

                <span class="text-primary text-[10px] sm:text-xs font-bold uppercase tracking-widest mb-1.5 block">New
                    Client</span>
                <h1
                    class="text-2xl sm:text-3xl font-serif text-gray-900 dark:text-white mb-1.5 sm:mb-2 font-bold leading-tight">
                    Create Account</h1>
                <p class="text-gray-500 dark:text-gray-400 text-xs sm:text-sm px-2">Register to book and manage your home
                    cleanings.</p>
            </div>

            <!-- Social Sign-up (Google & Apple) -->
            <div class="grid grid-cols-2 gap-3 mb-4 sm:mb-5">
                <button type="button" id="googleAuthBtn"
                    class="flex items-center justify-center gap-2.5 py-2.5 px-3 sm:px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700/60 text-gray-700 dark:text-gray-200 font-semibold text-xs sm:text-sm shadow-sm hover:shadow transition-all group active:scale-[0.98]">
                    <!-- Google Color Logo SVG -->
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Google</span>
                </button>
                <button type="button" id="appleAuthBtn"
                    class="flex items-center justify-center gap-2.5 py-2.5 px-3 sm:px-4 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700/60 text-gray-700 dark:text-gray-200 font-semibold text-xs sm:text-sm shadow-sm hover:shadow transition-all group active:scale-[0.98]">
                    <i class="fab fa-apple text-base text-gray-900 dark:text-white group-hover:scale-110 transition-transform"></i>
                    <span>Apple</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="relative flex items-center justify-center mb-4 sm:mb-5">
                <div class="border-t border-gray-200 dark:border-gray-700 w-full"></div>
                <span
                    class="bg-white dark:bg-darkCard px-3 text-[10px] sm:text-xs uppercase tracking-wider text-gray-400 dark:text-gray-500 font-bold absolute">or
                    register with email</span>
            </div>

            <!-- Signup Form -->
            <form action="login.html" method="GET" class="space-y-3.5 sm:space-y-4">

                <!-- Full Name Input Field -->
                <div class="relative">
                    <label for="name"
                        class="block text-[10px] sm:text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Full
                        Name</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-user absolute left-3.5 text-gray-400 icon-left text-sm"></i>
                        <input type="text" id="name"
                            class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg sm:rounded-xl py-2.5 sm:py-3 pl-9 pr-3 sm:pl-10 sm:pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-xs sm:text-sm font-medium input-field"
                            placeholder="John Doe" required>
                    </div>
                </div>

                <!-- Email Input Field -->
                <div class="relative">
                    <label for="email"
                        class="block text-[10px] sm:text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Email
                        Address</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-envelope absolute left-3.5 text-gray-400 icon-left text-sm"></i>
                        <input type="email" id="email"
                            class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg sm:rounded-xl py-2.5 sm:py-3 pl-9 pr-3 sm:pl-10 sm:pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-xs sm:text-sm font-medium input-field"
                            placeholder="client@example.com" required>
                    </div>
                </div>

                <!-- Password Input Field -->
                <div class="relative">
                    <label for="password"
                        class="block text-[10px] sm:text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Create
                        Password</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-lock absolute left-3.5 text-gray-400 icon-left text-sm"></i>
                        <input type="password" id="password"
                            class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg sm:rounded-xl py-2.5 sm:py-3 pl-9 pr-3 sm:pl-10 sm:pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-xs sm:text-sm font-medium input-field"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Confirm Password Input Field -->
                <div class="relative">
                    <label for="confirm-password"
                        class="block text-[10px] sm:text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-1.5">Confirm
                        Password</label>
                    <div class="relative flex items-center">
                        <i class="fas fa-shield-alt absolute left-3.5 text-gray-400 icon-left text-sm"></i>
                        <input type="password" id="confirm-password"
                            class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-lg sm:rounded-xl py-2.5 sm:py-3 pl-9 pr-3 sm:pl-10 sm:pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-xs sm:text-sm font-medium input-field"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Terms Checkbox -->
                <div class="flex items-start mt-3 sm:mt-4">
                    <input type="checkbox" id="terms"
                        class="w-3.5 h-3.5 sm:w-4 sm:h-4 mt-0.5 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary cursor-pointer bg-white dark:bg-gray-800 flex-shrink-0"
                        required>
                    <label for="terms"
                        class="ml-2 rtl:mr-2 rtl:ml-0 sm:ml-3 sm:rtl:mr-3 sm:rtl:ml-0 text-[11px] sm:text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none leading-snug font-medium">
                        I agree to the <a href="#"
                            class="text-primary hover:text-secondary underline transition-colors">Terms of Service</a> and
                        <a href="#" class="text-primary hover:text-secondary underline transition-colors">Privacy
                            Policy</a>.
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full py-3.5 rounded-xl bg-primary hover:bg-secondary text-white font-bold text-xs sm:text-sm uppercase tracking-widest transition-all shadow-lg hover:shadow-primary/30 mt-4 sm:mt-5 flex justify-center items-center gap-2 group active:scale-[0.99]">
                    Create Account <i class="fas fa-user-plus group-hover:scale-110 transition-transform"></i>
                </button>
            </form>

            <!-- Footer Login Link -->
            <div class="mt-5 sm:mt-6 pt-4 border-t border-gray-100 dark:border-gray-800 text-center">
                <p class="text-[11px] sm:text-sm text-gray-500 dark:text-gray-400">
                    Already a registered client?
                    <a href="login.html"
                        class="text-primary font-semibold hover:text-secondary transition-colors ml-1 rtl:mr-1 rtl:ml-0 inline-block">Secure
                        Sign In</a>
                </p>
            </div>
        </main>
    </div>

    <!-- JavaScript for Theme & RTL -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Theme Toggle Logic
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            function updateThemeUI(isDark) {
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }

            // Check local storage for theme
            const savedTheme = localStorage.getItem('theme');
            const isDarkMode = savedTheme === 'dark';
            updateThemeUI(isDarkMode);

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const currentlyDark = html.classList.contains('dark');
                    updateThemeUI(!currentlyDark);
                    localStorage.setItem('theme', !currentlyDark ? 'dark' : 'light');
                });
            }

            // RTL Logic
            const rtlToggle = document.getElementById('rtlToggle');
            const rtlText = document.getElementById('rtlText');

            function updateRTLUI(currentDir) {
                const label = currentDir === 'rtl' ? 'LTR' : 'RTL';
                if (rtlText) {
                    rtlText.innerText = label;
                } else if (rtlToggle) {
                    rtlToggle.innerText = label;
                }
            }

            // Check local storage for direction
            const savedDir = localStorage.getItem('direction') || 'ltr';
            html.dir = savedDir;
            updateRTLUI(savedDir);

            if (rtlToggle) {
                rtlToggle.addEventListener('click', () => {
                    const newDir = html.dir === 'rtl' ? 'ltr' : 'rtl';
                    html.dir = newDir;
                    localStorage.setItem('direction', newDir);
                    updateRTLUI(newDir);
                });
            }

            // Social button demo handlers
            const googleBtn = document.getElementById('googleAuthBtn');
            const appleBtn = document.getElementById('appleAuthBtn');
            if (googleBtn) {
                googleBtn.addEventListener('click', () => {
                    window.location.href = 'user.html';
                });
            }
            if (appleBtn) {
                appleBtn.addEventListener('click', () => {
                    window.location.href = 'user.html';
                });
            }
        });
    </script>
</body>

</html>
