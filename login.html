<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - CleanHome Service</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧹</text></svg>">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS Configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enables dark mode via a class on the <html> tag
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Trustworthy Sky Blue
                        secondary: '#0284c7',
                        accent: '#38bdf8',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* Smooth Background Transitions */
        body {
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* RTL adjustments */
        [dir="rtl"] .icon-left {
            left: auto;
            right: 1rem;
        }

        [dir="rtl"] .input-field {
            padding-left: 1rem;
            padding-right: 2.5rem;
        }
    </style>
</head>

<body
    class="font-sans text-gray-800 bg-gray-50 dark:bg-darkBg dark:text-gray-100 min-h-screen flex items-center justify-center relative overflow-x-hidden overflow-y-auto py-8">

    <!-- Decorative Background Elements -->
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-primary/20 rounded-full blur-3xl pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-secondary/20 rounded-full blur-3xl pointer-events-none">
    </div>

    <!-- Top Right Controls (Theme & RTL) -->
    <div class="absolute top-6 right-6 z-50 flex items-center gap-3">
        <button id="themeToggle"
            class="w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-darkCard shadow-md border border-gray-100 dark:border-gray-700 hover:text-primary transition-colors text-gray-600 dark:text-gray-300"
            title="Toggle Theme">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
        </button>
        <button id="rtlToggle"
            class="px-4 h-10 flex items-center justify-center rounded-full bg-white dark:bg-darkCard shadow-md border border-gray-100 dark:border-gray-700 hover:text-primary transition-colors font-bold text-xs text-gray-600 dark:text-gray-300"
            title="Toggle RTL">
            LTR
        </button>
    </div>

    <!-- Main Reviews Card -->
    <main
        class="w-full max-w-md bg-white dark:bg-darkCard border border-gray-100 dark:border-gray-800 p-6 sm:p-8 shadow-2xl relative z-10 rounded-3xl mx-4">

        <!-- Header & Exact Logo Match -->
        <div class="text-center mb-6">
            <div class="flex justify-center mb-4">
                <!-- LOGO: 100% Identical to Main Pages -->
                <a href="index.html" class="flex items-center gap-2 text-decoration-none">
                    <i
                        class="fas fa-broom text-3xl text-primary bg-clip-text bg-gradient-to-br from-primary to-secondary"></i>
                    <span
                        class="font-serif text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary tracking-tight">CleanHome</span>
                </a>
            </div>

            <span class="text-primary text-xs font-bold uppercase tracking-widest mb-3 block">Welcome Back</span>
            <h1 class="text-3xl font-serif text-gray-900 dark:text-white mb-2 font-bold">Client Reviews</h1>
            <p class="text-gray-500 dark:text-gray-400 text-sm">Please sign in to manage your bookings.</p>
        </div>

        <!-- Reviews Form -->
        <form action="user.html" method="GET" class="space-y-4">

            <!-- Email Input Field -->
            <div class="relative">
                <label for="email"
                    class="block text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400 mb-2">Email
                    Address</label>
                <div class="relative flex items-center">
                    <i class="fas fa-envelope absolute left-4 text-gray-400 icon-left"></i>
                    <input type="email" id="email"
                        class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-sm font-medium input-field"
                        placeholder="client@example.com" required>
                </div>
            </div>

            <!-- Password Input Field -->
            <div class="relative">
                <div class="flex justify-between items-center mb-2">
                    <label for="password"
                        class="block text-xs font-bold uppercase tracking-wide text-gray-500 dark:text-gray-400">Password</label>
                    <a href="#"
                        class="text-xs uppercase tracking-wide text-primary hover:text-secondary transition-colors font-semibold">Recovery?</a>
                </div>
                <div class="relative flex items-center">
                    <i class="fas fa-lock absolute left-4 text-gray-400 icon-left"></i>
                    <input type="password" id="password"
                        class="w-full bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl py-2 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all text-gray-800 dark:text-gray-100 text-sm font-medium input-field"
                        placeholder="••••••••" required>
                </div>
            </div>

            <!-- Remember Me Checkbox -->
            <div class="flex items-center mt-2">
                <input type="checkbox" id="remember"
                    class="w-4 h-4 rounded border-gray-300 dark:border-gray-600 text-primary focus:ring-primary cursor-pointer bg-white dark:bg-gray-800">
                <label for="remember"
                    class="ml-3 text-sm text-gray-600 dark:text-gray-400 cursor-pointer select-none font-medium">Remember
                    my session</label>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full py-3 rounded-xl bg-primary hover:bg-secondary text-white font-bold text-sm uppercase tracking-widest transition-all shadow-lg hover:shadow-primary/30 mt-4 flex justify-center items-center gap-2 group">
                Secure Sign In <i
                    class="fas fa-arrow-right group-hover:translate-x-1 transition-transform rtl:rotate-180"></i>
            </button>
        </form>

        <!-- Footer Signup Link -->
        <div class="mt-6 pt-4 border-t border-gray-100 dark:border-gray-800 text-center">
            <p class="text-sm text-gray-500 dark:text-gray-400">
                New to CleanHome?
                <a href="signup.html"
                    class="text-primary font-semibold hover:text-secondary transition-colors ml-1 inline-block">Create
                    an account</a>
            </p>
        </div>
    </main>

    <!-- JavaScript for Theme & RTL -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Theme Toggle Logic
            const themeToggle = document.getElementById('themeToggle');
            const html = document.documentElement;

            function updateThemeUI(isDark) {
                if (isDark) {
                    html.classList.add('dark');
                } else {
                    html.classList.remove('dark');
                }
            }

            // Check local storage for theme
            const savedTheme = localStorage.getItem('theme');
            const isDarkMode = savedTheme === 'dark';
            updateThemeUI(isDarkMode);

            themeToggle.addEventListener('click', () => {
                const currentlyDark = html.classList.contains('dark');
                updateThemeUI(!currentlyDark);
                localStorage.setItem('theme', !currentlyDark ? 'dark' : 'light');
            });

            // RTL Logic
            const rtlToggle = document.getElementById('rtlToggle');

            function updateRTLUI(currentDir) {
                rtlToggle.innerText = currentDir === 'rtl' ? 'RTL' : 'LTR';
            }

            // Check local storage for direction
            const savedDir = localStorage.getItem('direction') || 'ltr';
            html.dir = savedDir;
            updateRTLUI(savedDir);

            rtlToggle.addEventListener('click', () => {
                const newDir = html.dir === 'rtl' ? 'ltr' : 'rtl';
                html.dir = newDir;
                localStorage.setItem('direction', newDir);
                updateRTLUI(newDir);
            });
        });
    </script>
</body>

</html>
